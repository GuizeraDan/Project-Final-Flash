<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Final Flash</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
<link rel="icon" href="assets/icones/icone-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ferramentas.css">
</head>
<body>
<div id="girar"><span>📱</span>Gire o celular para jogar deitado</div>
<div id="jogo">
  <canvas id="tela" width="1084" height="580"></canvas>

  <div id="menu"></div>

  <div id="ajuda">Espaço / toque na tela: <b>guarda</b> quando o anel azul fechar · <b>crítico</b> quando o anel dourado fechar</div>

  <div id="inicio">
    <h1>FINAL FLASH</h1>
    <h3>Saga Saiyajin</h3>
    <p id="carregando">Toque ou aperte Enter para começar</p>
    <div id="titulo-menu" class="menu-titulo">
      <button data-acao="novo">Novo Jogo</button>
      <button data-acao="continuar">Continuar</button>
      <button data-acao="livre">Batalha Livre</button>
      <button data-acao="treino">Treinamento (AP)</button>
      <button data-acao="opcoes">Opções</button>
      <button data-acao="instalar" class="ferramenta" hidden>📲 Instalar no celular</button>
      <button data-acao="lab" class="ferramenta">🧪 Laboratório de golpes</button>
      <button data-acao="visualizador" class="ferramenta">🎞 Visualizador de animações</button>
    </div>
    <div id="escolha" class="menu-titulo">
      <button data-batalha="saiyajin_01">Goku vs Raditz</button>
      <button data-batalha="saiyajin_02">Trio vs Raditz</button>
      <button data-batalha="saiyajin_03">Trio vs Saibamen</button>
      <button data-batalha="saiyajin_04">Trio vs Nappa</button>
      <button data-batalha="saiyajin_05">Trio vs Vegeta</button>
      <button data-acao="voltar">Voltar</button>
    </div>
    <div id="treino" class="menu-titulo">
      <div class="ap-total">AP: <b id="ap-valor">0</b></div>
      <div id="treino-lista"></div>
      <button data-acao="voltar">Voltar</button>
    </div>
    <div id="opcoes" class="menu-titulo">
      <label>Música <input type="range" id="vol-musica" min="0" max="100"></label>
      <label>Efeitos <input type="range" id="vol-sfx" min="0" max="100"></label>
      <label>Vozes <input type="range" id="vol-voz" min="0" max="100"></label>
      <button data-acao="apagar">Apagar progresso</button>
      <button data-acao="voltar">Voltar</button>
    </div>
  </div>

  <div id="dialogo">
    <div class="cap"></div>
    <div class="caixa">
      <canvas class="retrato" width="120" height="120"></canvas>
      <div class="corpo"><div class="nome"></div><div class="texto"></div></div>
    </div>
    <div class="dica">toque / Enter para continuar · Esc para pular</div>
  </div>

  <div id="fim">
    <h2>Vitória!</h2>
    <p id="ap-ganho"></p>
    <button id="denovo">Lutar de novo</button>
    <button id="proximo">Próximo capítulo</button>
    <button id="titulo">Tela de título</button>
  </div>
</div>

<script src="data/bundle.js"></script>
<script src="js/core/clock.js"></script>
<script src="js/core/assets.js"></script>
<script src="js/core/sprite.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/input.js"></script>
<script src="js/battle/fighter.js"></script>
<script src="js/battle/script.js"></script>
<script src="js/battle/ai.js"></script>
<script src="js/battle/hud.js"></script>
<script src="js/battle/battle.js"></script>
<script src="js/ferramentas/laboratorio.js"></script>
<script src="js/pwa.js"></script>
<script src="js/main.js"></script>
</body>
</html>
