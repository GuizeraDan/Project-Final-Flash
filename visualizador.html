<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Final Flash — Estúdio</title>
<!-- O visualizador foi substituído pelo Estúdio (aba Sprites). Endereço mantido só para redirecionar. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search), d = 'estudio.html?aba=sprites';
    if (q.get('sprite')) d += '&sprite=' + encodeURIComponent(q.get('sprite'));
    if (q.get('anim')) d += '&anim=' + encodeURIComponent(q.get('anim'));
    location.replace(d);
  })();
</script>
</head>
<body><p>O visualizador agora é a aba <a href="estudio.html?aba=sprites">Sprites do Estúdio</a>.</p></body>
</html>
